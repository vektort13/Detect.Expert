<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Detect.Expert — Fingerprint Protection + Forensics &amp; Antidetect</title>
  <desc id="banner-desc">Detect.Expert logo on a blue gradient with the product name and a short tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061028"/>
      <stop offset="0.52" stop-color="#0C2A69"/>
      <stop offset="1" stop-color="#2D66D2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#7DA9FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7DA9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1" r="0.55">
      <stop offset="0" stop-color="#2D66D2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2D66D2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CC0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9CC0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9CC0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#030A1E" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="320"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect width="1280" height="320" fill="url(#glow2)"/>
    <!-- large faint logo mark on the right -->
    <g transform="translate(852 40) scale(10.8)" fill="#FFFFFF" fill-opacity="0.09">
      <path d="M0.0138095 17.126C0.474424 12.1227 2.88868 7.31189 7.12951 3.97639C15.2776 -2.45406 27.1424 -0.914601 33.4481 7.36C36.2753 11.0804 37.5142 15.5384 37.2759 19.8842C37.26 20.2209 36.9424 20.4775 36.6088 20.4454C36.2912 20.4133 36.0688 20.1247 36.0847 19.804C36.3706 16.4524 35.5129 12.9887 33.4481 10.0701C28.6672 3.33495 19.2167 1.95585 12.7522 7.05532C9.35316 9.73334 7.44717 13.6461 7.20892 17.6872C7.09774 19.4191 5.8112 20.8303 4.11169 21.0708C1.80862 21.3915 -0.192673 19.4672 0.0138095 17.126Z"/>
      <path d="M17.0259 14.3195C19.1384 14.3195 20.8697 12.5876 20.8697 10.4388C20.8697 9.30025 20.3773 8.27395 19.6149 7.56836C23.0616 7.85701 25.7617 10.7595 25.7617 14.3195C25.7617 18.0559 22.7598 21.0868 19.059 21.0868C15.3582 21.0868 12.3563 18.0559 12.3563 14.3195C12.3563 13.1008 12.6739 11.9462 13.2457 10.952C13.4681 12.8603 15.0723 14.3195 17.0259 14.3195Z"/>
    </g>
    <!-- thin scan line -->
    <rect x="0" y="262" width="1280" height="2" fill="url(#scan)"/>

    <!-- logo tile -->
    <rect x="84" y="88" width="144" height="144" rx="34" fill="url(#tile)" filter="url(#soft)"/>
    <g transform="translate(101.5 124.5) scale(2.9)">
      <path d="M0.0138095 17.126C0.474424 12.1227 2.88868 7.31189 7.12951 3.97639C15.2776 -2.45406 27.1424 -0.914601 33.4481 7.36C36.2753 11.0804 37.5142 15.5384 37.2759 19.8842C37.26 20.2209 36.9424 20.4775 36.6088 20.4454C36.2912 20.4133 36.0688 20.1247 36.0847 19.804C36.3706 16.4524 35.5129 12.9887 33.4481 10.0701C28.6672 3.33495 19.2167 1.95585 12.7522 7.05532C9.35316 9.73334 7.44717 13.6461 7.20892 17.6872C7.09774 19.4191 5.8112 20.8303 4.11169 21.0708C1.80862 21.3915 -0.192673 19.4672 0.0138095 17.126Z" fill="#2D66D2"/>
      <path d="M17.0259 14.3195C19.1384 14.3195 20.8697 12.5876 20.8697 10.4388C20.8697 9.30025 20.3773 8.27395 19.6149 7.56836C23.0616 7.85701 25.7617 10.7595 25.7617 14.3195C25.7617 18.0559 22.7598 21.0868 19.059 21.0868C15.3582 21.0868 12.3563 18.0559 12.3563 14.3195C12.3563 13.1008 12.6739 11.9462 13.2457 10.952C13.4681 12.8603 15.0723 14.3195 17.0259 14.3195Z" fill="#2D66D2"/>
    </g>

    <!-- text -->
    <text x="262" y="150" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Detect.Expert</text>
    <text x="264" y="196" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#D7E5FF">Fingerprint Protection + Forensics &amp; Antidetect</text>

    <!-- chips -->
    <g font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#EAF2FF">
      <rect x="264" y="218" width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="349" y="240" text-anchor="middle">Chrome &#183; Firefox</text>
      <rect x="446" y="218" width="126" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="509" y="240" text-anchor="middle">Manifest V3</text>
      <rect x="584" y="218" width="136" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="652" y="240" text-anchor="middle">21 languages</text>
      <rect x="732" y="218" width="128" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="796" y="240" text-anchor="middle">local-first</text>
