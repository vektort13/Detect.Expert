<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>protect: password tripwire</title>
  </head>
  <body>
    <!--
      ADR-020 §12 / E21-05 (S05): stand of tests/extension/protect/password-never-read.spec.ts. The page script never reads
      a field value; the only read is #positive-control (one read of the password in the page's MAIN world, the positive
      control of the MAIN tripwire). Top document: e-mail, phone, name, a password with a "show password" toggle
      (type -> text), a one-time code and a textarea, plus a payment iframe from another site (cc-number next to an
      e-mail). The same file renders the payment frame with ?frame=payment. ?frameHost=<host> sets the frame's host
      (default: this host on the other fixture port).
    -->
    <h1 id="title">Password tripwire</h1>
    <form id="account" action="#" autocomplete="on">
      <label>E-mail <input id="email" name="email" type="email" autocomplete="email" /></label>
      <label>Phone <input id="phone" name="phone" type="tel" autocomplete="tel" /></label>
      <label>Name <input id="name" name="full_name" type="text" autocomplete="name" /></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" /></label>
      <button id="show-password" type="button">Show password</button>
      <label>Code <input id="otp" name="code" type="text" autocomplete="one-time-code" inputmode="numeric" /></label>
      <label>Notes <textarea id="notes" name="notes"></textarea></label>
    </form>
    <form id="payment" action="#" hidden>
      <label>Card number <input id="cc-number" name="cardnumber" type="text" autocomplete="cc-number" inputmode="numeric" /></label>
      <label>E-mail for the receipt <input id="pay-email" name="email" type="email" autocomplete="email" /></label>
    </form>
    <p><button id="positive-control" type="button">Positive control: read the password once (MAIN world)</button></p>
    <div id="frame-slot"></div>
    <pre id="result"></pre>
    <script src="../fixture-lib.js"></script>
    <script>
      (function () {
        var F = window.__fixture;
        var params = new URLSearchParams(location.search);
        var frame = params.get('frame') === 'payment' ? 'payment' : 'top';
        var state = { fixture: 'protect-password-tripwire', frame: frame, positiveControlReads: 0, toggles: 0, frameLoaded: false };

        if (frame === 'payment') {
          // Payment frame: only the payment form (cc-number + e-mail) is shown.
          document.getElementById('account').hidden = true;
          document.getElementById('positive-control').hidden = true;
          document.getElementById('payment').hidden = false;
          document.getElementById('title').textContent = 'Payment frame';
          F.publish(state);
          return;
        }

        document.getElementById('payment').remove();
        var password = document.getElementById('password');
        document.getElementById('show-password').addEventListener('click', function () {
          // "Show password": only the type attribute changes; the value is never read here.
          var shown = password.getAttribute('type') === 'password';
          password.setAttribute('type', shown ? 'text' : 'password');
          state.toggles++;
          F.publish(state);
        });
        document.getElementById('positive-control').addEventListener('click', function () {
          // The one deliberate read of the password (MAIN world): the MAIN tripwire must count exactly this one.
          var read = password.value;
          state.positiveControlReads += typeof read === 'string' ? 1 : 0;
          read = null;
          F.publish(state);
        });

        var host = params.get('frameHost');
        var port = location.port === '4173' ? '4174' : '4173';
        var frameHost = host !== null && /^[a-z0-9.-]{1,253}$/i.test(host) ? host : location.hostname;
        var iframe = document.createElement('iframe');
        iframe.id = 'pay-frame';
        iframe.title = 'Payment';
        iframe.width = '480';
        iframe.height = '160';
        iframe.src = location.protocol + '//' + frameHost + ':' + port + location.pathname + '?frame=payment';
        iframe.addEventListener('load', function () {
          state.frameLoaded = true;
          F.publish(state);
        });
        document.getElementById('frame-slot').appendChild(iframe);
        F.publish(state);
      })();
    </script>
  </body>
</html>
